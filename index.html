<html lang="id">
<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

    <style>
        :root {
            /* CYBER TRANSPARENT V3 (DEEP NEON GLASS) */
            --bg-gradient: radial-gradient(circle at 12% 18%, rgba(0, 243, 255, 0.16) 0%, transparent 45%),
                           radial-gradient(circle at 88% 82%, rgba(255, 0, 127, 0.14) 0%, transparent 45%),
                           linear-gradient(135deg, #040711 0%, #080e20 50%, #03060e 100%);
            --cyber-grid: rgba(0, 243, 255, 0.045);
            --accent: #00f3ff;
            --accent-secondary: #ff007f;
            --accent-hover: #38bdf8;
            --accent-glow: 0 0 18px rgba(0, 243, 255, 0.45);
            --live-red: #ff2a55;
            --live-green: #00ff9d;
            --text-dark: #e2f1ff;
            --text-gray: #7f9bb8;
            --glass-bg: rgba(10, 16, 32, 0.45);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-shadow: 0 14px 42px 0 rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(0, 243, 255, 0.04);
            --bubble-bg: rgba(0, 243, 255, 0.07);
            --bubble-border: rgba(0, 243, 255, 0.22);
            --input-bg: rgba(6, 11, 24, 0.7);
            --nav-bg: rgba(7, 12, 26, 0.85);
            --scrollbar-thumb: #00f3ff;
            --scrollbar-track: rgba(0, 243, 255, 0.05);

            --plyr-color-main: #00f3ff !important;
            --plyr-video-control-color-hover: #050811 !important;
            --plyr-video-control-background-hover: #00f3ff !important;
        }

        /* ALTERNATE CYBER LIGHT / HOLOGRAPHIC ICE MODE */
        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.22) 0%, transparent 45%),
                           radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
                           linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e2e8f0 100%);
            --cyber-grid: rgba(2, 132, 199, 0.07);
            --accent: #0284c7;
            --accent-secondary: #9333ea;
            --accent-hover: #0369a1;
            --accent-glow: 0 0 16px rgba(2, 132, 199, 0.35);
            --live-red: #ef4444;
            --live-green: #059669;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --glass-bg: rgba(255, 255, 255, 0.52);
            --glass-border: rgba(2, 132, 199, 0.32);
            --glass-shadow: 0 12px 40px 0 rgba(15, 23, 42, 0.12), inset 0 0 18px rgba(2, 132, 199, 0.06);
            --bubble-bg: rgba(255, 255, 255, 0.72);
            --bubble-border: rgba(2, 132, 199, 0.25);
            --input-bg: rgba(255, 255, 255, 0.85);
            --nav-bg: rgba(240, 249, 255, 0.88);
            --scrollbar-thumb: #0284c7;
            --scrollbar-track: rgba(2, 132, 199, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-y: auto; overflow-x: hidden;
            display: flex;
            position: relative;
        }

        /* CYBER GRID OVERLAY */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, var(--cyber-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--cyber-grid) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
        }

        /* SCROLLBAR CHAT */
        .msgs::-webkit-scrollbar { width: 5px; }
        .msgs::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 99px; }
        .msgs::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; box-shadow: var(--accent-glow); }

        /* PLYR.IO FLOATING CYBER CONTROLS */
        .plyr {
            border-radius: 26px !important;
            overflow: hidden !important;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
            width: 100% !important;
            height: 100% !important;
        }

        .plyr__controls {
            position: absolute !important;
            bottom: 14px !important;
            left: 14px !important;
            right: 14px !important;
            background: rgba(8, 13, 28, 0.65) !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
            border: 1px solid rgba(0, 243, 255, 0.35) !important;
            border-radius: 22px !important;
            padding: 8px 16px !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45) !important;
        }

        .plyr__control {
            border-radius: 14px !important;
        }

        /* VERTICAL VOLUME SLIDER */
        .plyr__volume { position: relative !important; }
        .plyr__volume input[type="range"] {
            position: absolute !important;
            bottom: 50px !important;
            left: 50% !important;
            transform: translateX(-50%) rotate(-90deg) !important;
            transform-origin: center center !important;
            width: 90px !important;
            height: 28px !important;
            padding: 6px !important;
            background: rgba(8, 13, 28, 0.88) !important;
            backdrop-filter: blur(14px) !important;
            border: 1px solid rgba(0, 243, 255, 0.35) !important;
            border-radius: 14px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.2s ease !important;
            z-index: 99 !important;
        }
        .plyr__volume:hover input[type="range"],
        .plyr__volume input[type="range"]:focus {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* TRIGGER ZONE SIDEBAR (DESKTOP) */
        .sidebar-trigger {
            position: fixed;
            top: 0; bottom: 0; left: 0;
            width: 18px;
            z-index: 99;
            background: linear-gradient(to right, rgba(0, 243, 255, 0.14), transparent);
            border-left: 2px solid var(--accent);
            opacity: 0.45;
            transition: opacity 0.3s ease;
        }
        .sidebar-trigger:hover { opacity: 1; }

        /* SIDEBAR DESKTOP AUTO-HIDE */
        .sidebar {
            width: 78px;
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            padding: 25px 0; gap: 18px; flex-shrink: 0;
            box-shadow: var(--glass-shadow);
            position: fixed; top: 12px; bottom: 12px; left: 0; z-index: 100;
            transform: translateX(-105%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .sidebar.show,
        .sidebar:hover,
        .sidebar-trigger:hover + .sidebar {
            transform: translateX(0);
        }

        .brand-logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            color: #050811; font-weight: 900; font-size: 19px; margin-bottom: 8px;
            box-shadow: var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.45);
        }

        .side-icon {
            width: 46px; height: 46px;
            background: rgba(0, 243, 255, 0.07);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-dark); font-size: 18px; text-decoration: none;
            transition: all 0.25s ease;
        }
        .side-icon:hover, .side-icon.active {
            background: var(--accent); color: #050811; border-color: var(--accent);
            transform: translateY(-2px); box-shadow: var(--accent-glow);
        }

        /* MAIN CONTENT GRID */
        .main-content {
            flex: 1;
            margin-left: 0;
            display: grid; grid-template-columns: 1fr 390px; gap: 24px; padding: 24px 24px 24px 30px;
            position: relative; z-index: 1;
            transition: margin-left 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
        }

        body.sidebar-open .main-content {
            margin-left: 78px;
        }

        .video-section { display: flex; flex-direction: column; gap: 20px; }

        /* TOP HEADER BAR V3 */
        .top-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .main-title-top {
            font-size: 26px; font-weight: 800; letter-spacing: -0.8px; color: var(--text-dark);
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            display: flex; align-items: center; gap: 10px;
        }
        .main-title-top span { color: var(--accent); text-shadow: var(--accent-glow); }

        .v3-pill-tag {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 99px;
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid var(--accent);
            color: var(--accent);
            letter-spacing: 0.8px;
        }

        /* QUICK ACTION PILLS (V3) */
        .quick-pills {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: var(--text-dark);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .pill-btn:hover {
            background: var(--accent);
            color: #050811;
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
            transform: translateY(-1px);
        }

        .player-wrapper {
            background: var(--glass-bg); backdrop-filter: blur(28px);
            border-radius: 32px; padding: 20px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
        }

        .player-box {
            position: relative; width: 100%; aspect-ratio: 16/9; background: #02040a; border-radius: 26px; overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.25);
        }
        .video-frame { width: 100%; height: 100%; border-radius: 26px; }

        .badge {
            position: absolute; top: 16px; left: 16px;
            background: rgba(6, 11, 24, 0.72); backdrop-filter: blur(14px);
            color: #fff; padding: 7px 16px; border-radius: 99px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; gap: 7px; z-index: 10;
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .dot { width: 8px; height: 8px; background: var(--live-red); border-radius: 50%; box-shadow: 0 0 8px var(--live-red); animation: pulse 1.5s infinite; }

        .stream-meta-row {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .modern-view-badge {
            background: rgba(0, 243, 255, 0.08); backdrop-filter: blur(12px);
            padding: 8px 18px; border-radius: 99px; font-weight: 700; font-size: 13px; color: var(--text-dark);
            border: 1px solid var(--glass-border); display: inline-flex; align-items: center; gap: 8px;
        }
        .live-dot-indicator { width: 8px; height: 8px; background: var(--live-red); border-radius: 50%; box-shadow: 0 0 8px var(--live-red); animation: pulse 1.5s infinite; }

        /* CHAT SECTION */
        .chat-card {
            background: var(--glass-bg); backdrop-filter: blur(28px);
            border-radius: 32px; display: flex; flex-direction: column;
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
            height: calc(100vh - 48px); position: sticky; top: 24px;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 22px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; color: var(--text-dark);
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 99px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.35);
            font-size: 11px;
            color: var(--live-green);
            font-weight: 700;
        }

        .msgs { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { display: flex; gap: 10px; animation: slideIn 0.3s ease-out; align-items: flex-start; }
        .msg img { width: 34px; height: 34px; border-radius: 50% !important; object-fit: cover; flex-shrink: 0; border: 1.5px solid var(--accent); }

        .bubble {
            background: var(--bubble-bg); backdrop-filter: blur(10px);
            padding: 11px 15px; border-radius: 20px; border-top-left-radius: 6px;
            font-size: 12.5px; line-height: 1.45; flex: 1; color: var(--text-dark); border: 1px solid var(--bubble-border);
        }
        .bubble b { color: var(--accent); font-size: 10.5px; display: block; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }

        .input-area {
            padding: 16px 18px; background: rgba(0, 243, 255, 0.03);
            border-top: 1px solid var(--glass-border);
        }
        .chat-row { display: flex; gap: 10px; align-items: center; }

        .chat-in {
            flex: 1; background: var(--input-bg); border: 1px solid var(--glass-border);
            padding: 11px 18px; border-radius: 99px; color: var(--text-dark); outline: none; font-size: 12.5px;
        }
        .chat-in:focus { border-color: var(--accent); box-shadow: var(--accent-glow); }

        .btn-send {
            background: var(--accent); border: none; width: 42px; height: 42px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: #050811; font-size: 15px;
            box-shadow: var(--accent-glow);
            flex-shrink: 0;
        }
        .btn-send:hover { background: var(--accent-hover); transform: scale(1.06); }

        .btn-upload {
            background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-dark);
            padding: 7px 14px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-upload:hover { background: var(--accent); color: #050811; border-color: var(--accent); box-shadow: var(--accent-glow); }

        /* MOBILE BOTTOM NAVIGATION BAR (ALA RCTI+ ROUNDED FLOATING) */
        .mobile-bottom-nav {
            display: none;
            position: fixed; bottom: 10px; left: 12px; right: 12px;
            height: 62px;
            background: var(--nav-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            z-index: 1000;
            align-items: center;
            justify-content: space-around;
            padding: 0 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-gray); text-decoration: none; font-size: 10px; font-weight: 700; gap: 3px;
            cursor: pointer; flex: 1; height: 46px; border-radius: 18px; transition: all 0.2s;
        }
        .nav-item span.icon { font-size: 19px; }
        .nav-item.active, .nav-item:hover {
            color: var(--accent);
            background: rgba(0, 243, 255, 0.08);
            text-shadow: var(--accent-glow);
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 900px) {
            .sidebar, .sidebar-trigger { display: none !important; }
            body.sidebar-open .main-content { margin-left: 0 !important; }

            .main-content {
                display: flex;
                flex-direction: column;
                grid-template-columns: 1fr;
                margin-left: 0 !important;
                padding: 14px 14px 86px 14px;
                gap: 16px;
            }

            .player-wrapper {
                border-radius: 26px;
                padding: 14px;
            }

            .chat-card {
                position: static;
                height: 390px;
                border-radius: 26px;
            }

            .mobile-bottom-nav {
                display: flex;
            }

            .main-title-top {
                font-size: 20px;
            }
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<script>
    const SB_URL = 'https://ggvfeibnwzliyrxufslx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndmZlaWJud3psaXlyeHVmc2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTQ4NjUsImV4cCI6MjEwNDE3MDg2NX0.u_oawCXaHGBbo7ZI3S3bm1c5Qs7OKGS_M6yVh6KYN2M';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    const liveStreamUrl = "http://localhost:8080/hls/TES NAMA BARO!!🤫🤫🥶🥶.m3u8";
    const video = document.getElementById('player');
    let hlsInstance = null;

    // LOGIKA AUTO-HIDE SIDEBAR KIRI (DESKTOP)
    const sidebar = document.getElementById('sidebar');
    const sidebarTrigger = document.getElementById('sidebarTrigger');
    let hideTimeout;

    function showSidebar() {
        clearTimeout(hideTimeout);
        sidebar.classList.add('show');
        document.body.classList.add('sidebar-open');
    }

    function hideSidebar() {
        hideTimeout = setTimeout(() => {
            sidebar.classList.remove('show');
            document.body.classList.remove('sidebar-open');
        }, 250);
    }

    sidebarTrigger.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseleave', hideSidebar);
    sidebarTrigger.addEventListener('mouseleave', () => {
        if (!sidebar.matches(':hover')) hideSidebar();
    });

    // PLYR.IO & HLS INITIALIZATION
    function initPlyrPlayer() {
        new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
            autoplay: true,
            muted: true
        });
        loadHlsStream();
    }

    function loadHlsStream() {
        if (hlsInstance) {
            hlsInstance.destroy();
        }
        if (Hls.isSupported()) {
            hlsInstance = new Hls({ maxPixelRatio: 1, lowLatencyMode: true });
            hlsInstance.loadSource(liveStreamUrl);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(() => {});
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = liveStreamUrl;
            video.play().catch(() => {});
        }
    }

    function reloadStream() {
        loadHlsStream();
    }

    function copyStreamLink() {
        navigator.clipboard?.writeText(window.location.href);
        alert("Link streaming berhasil disalin!");
    }

    // AVATAR SYSTEM
    const defaultAvatarUrl = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Anonim')}&background=00f3ff&color=050811`;
    let isCustomAvatar = false;
    let currentUserAvatar = defaultAvatarUrl('Anonim');

    function updateDefaultAvatar() {
        if (!isCustomAvatar) {
            const user = document.getElementById('uName').value.trim() || 'Anonim';
            currentUserAvatar = defaultAvatarUrl(user);
            document.getElementById('displayPP').src = currentUserAvatar;
        }
    }

    function handleGalleryUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                isCustomAvatar = true;
                currentUserAvatar = e.target.result;
                document.getElementById('displayPP').src = currentUserAvatar;
            };
            reader.readAsDataURL(file);
        }
    }

    // COUNTER PENONTON
    let currentViewers = 1451653;
    function updateViewerCounter() {
        currentViewers += Math.floor(Math.random() * 31) - 12;
        document.getElementById('viewCount').innerText = currentViewers.toLocaleString('id-ID');
        setTimeout(updateViewerCounter, Math.floor(Math.random() * 1000) + 1500);
    }

    // CHAT SYSTEM
    function renderChat(d) {
        if (!d || !d.content) return;
        const box = document.getElementById('msgs');
        const div = document.createElement('div');
        div.className = 'msg';
        const fallbackAvatar = defaultAvatarUrl(d.username || 'Anonim');

        div.innerHTML = `
            <img src="${d.avatar_url || fallbackAvatar}" onerror="this.src='${fallbackAvatar}'">
            <div class="bubble">
                <b>${d.username || 'Anonim'}</b>
                ${d.content}
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function initLiveChat() {
        const box = document.getElementById('msgs');
        box.innerHTML = '<div style="text-align:center; font-size:12px; opacity:0.6;">Memuat chat...</div>';

        const { data, error } = await sb.from('messages').select('*').order('id', { ascending: false }).limit(30);
        box.innerHTML = '';

        if (!error && data) {
            data.reverse().forEach(renderChat);
        }

        sb.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderChat(payload.new);
            })
            .subscribe();
    }

    async function sendMsg() {
        const inEl = document.getElementById('chatIn');
        const text = inEl.value.trim();
        const user = document.getElementById('uName').value.trim() || 'Anonim';
        if (!text) return;
        inEl.value = '';

        const finalAvatar = isCustomAvatar ? currentUserAvatar : defaultAvatarUrl(user);
        await sb.from('messages').insert([{ username: user, content: text, avatar_url: finalAvatar }]);
    }

    // FIXED THEME TOGGLE
    function toggleTheme() {
        const htmlEl = document.documentElement;
        const currentTheme = htmlEl.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        htmlEl.setAttribute('data-theme', newTheme);
        
        const icon = newTheme === 'light' ? '🌙' : '☀️';
        const themeBtn = document.getElementById('themeToggleBtn');
        const mobileIcon = document.getElementById('mobileThemeIcon');
        if (themeBtn) themeBtn.innerText = icon;
        if (mobileIcon) mobileIcon.innerText = icon;
    }

    document.addEventListener("DOMContentLoaded", () => {
        initPlyrPlayer();
        initLiveChat();
        updateViewerCounter();
    });

    document.getElementById('chatIn').onkeypress = e => { if (e.key === 'Enter') sendMsg(); };
</script>
</body>
</html>
