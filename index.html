<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HafidStream Premium V3 - Cyber Edition</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

    <style>
        :root {
            /* CYBER TRANSPARENT DEFAULT (CYBER DARK GLASS) */
            --bg-gradient: radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.14) 0%, transparent 45%),
                           radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.14) 0%, transparent 45%),
                           linear-gradient(135deg, #050811 0%, #090e1f 50%, #040710 100%);
            --cyber-grid: rgba(0, 243, 255, 0.045);
            --accent: #00f3ff;
            --accent-secondary: #ff007f;
            --accent-hover: #38bdf8;
            --accent-glow: 0 0 15px rgba(0, 243, 255, 0.45);
            --live-red: #ff2a55;
            --live-green: #00ff9d;
            --text-dark: #e2f1ff;
            --text-gray: #7f9bb8;
            --glass-bg: rgba(10, 16, 32, 0.42);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.55), inset 0 0 20px rgba(0, 243, 255, 0.04);
            --bubble-bg: rgba(0, 243, 255, 0.06);
            --bubble-border: rgba(0, 243, 255, 0.2);
            --input-bg: rgba(6, 11, 24, 0.65);
            --scrollbar-thumb: #00f3ff;
            --scrollbar-track: rgba(0, 243, 255, 0.05);

            --plyr-color-main: #00f3ff !important;
            --plyr-video-control-color-hover: #050811 !important;
            --plyr-video-control-background-hover: #00f3ff !important;
        }

        /* ALTERNATE CYBER LIGHT / HOLOGRAPHIC ICE MODE */
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.2) 0%, transparent 45%),
                           radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
                           linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e2e8f0 100%);
            --cyber-grid: rgba(2, 132, 199, 0.07);
            --accent: #0284c7;
            --accent-secondary: #9333ea;
            --accent-hover: #0369a1;
            --accent-glow: 0 0 14px rgba(2, 132, 199, 0.35);
            --live-red: #ef4444;
            --live-green: #059669;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(2, 132, 199, 0.3);
            --glass-shadow: 0 12px 40px 0 rgba(15, 23, 42, 0.12), inset 0 0 18px rgba(2, 132, 199, 0.06);
            --bubble-bg: rgba(255, 255, 255, 0.65);
            --bubble-border: rgba(2, 132, 199, 0.25);
            --input-bg: rgba(255, 255, 255, 0.75);
            --scrollbar-thumb: #0284c7;
            --scrollbar-track: rgba(2, 132, 199, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0;
            transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-y: auto; overflow-x: hidden;
            display: flex;
            position: relative;
        }

        /* CYBER GRID OVERLAY */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, var(--cyber-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--cyber-grid) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
        }

        /* CUSTOM CYBER SCROLLBAR CHAT */
        .msgs::-webkit-scrollbar {
            width: 5px;
        }
        .msgs::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        .msgs::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
            box-shadow: var(--accent-glow);
        }
        .msgs::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* OVERRIDE PLYR UI FLOATING GLASS TRANSLUCENT */
        .plyr {
            border-radius: 24px !important;
            overflow: hidden !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100% !important;
            height: 100% !important;
        }

        .plyr__controls {
            position: absolute !important;
            bottom: 14px !important;
            left: 14px !important;
            right: 14px !important;
            background: rgba(8, 13, 28, 0.55) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(0, 243, 255, 0.3) !important;
            border-radius: 20px !important;
            padding: 10px 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 15px rgba(0, 243, 255, 0.15) !important;
        }

        /* OVERRIDE PLYR VOLUME SLIDER VERTIKAL */
        .plyr__volume {
            position: relative !important;
        }

        .plyr__volume input[type="range"] {
            position: absolute !important;
            bottom: 50px !important;
            left: 50% !important;
            transform: translateX(-50%) rotate(-90deg) !important;
            transform-origin: center center !important;
            width: 90px !important;
            height: 28px !important;
            padding: 6px !important;
            background: rgba(8, 13, 28, 0.85) !important;
            backdrop-filter: blur(14px) !important;
            border: 1px solid rgba(0, 243, 255, 0.35) !important;
            border-radius: 12px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.2s ease !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5) !important;
            z-index: 99 !important;
        }

        .plyr__volume:hover input[type="range"],
        .plyr__volume input[type="range"]:focus {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* AREA PEMICU (TRIGGER ZONE) DI TEPI KIRI LAYAR */
        .sidebar-trigger {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 18px;
            z-index: 99;
            background: linear-gradient(to right, rgba(0, 243, 255, 0.12), transparent);
            border-left: 2px solid var(--accent);
            opacity: 0.45;
            transition: opacity 0.3s ease;
        }
        .sidebar-trigger:hover {
            opacity: 1;
        }

        /* SIDEBAR AUTO-HIDE */
        .sidebar {
            width: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 0; gap: 20px; flex-shrink: 0;
            box-shadow: var(--glass-shadow);
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s, border-color 0.3s;
        }

        /* Muncul saat di-hover atau via class .show */
        .sidebar.show,
        .sidebar:hover,
        .sidebar-trigger:hover + .sidebar {
            transform: translateX(0);
        }

        .brand-logo {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #050811; font-weight: 900; font-size: 20px; margin-bottom: 10px;
            box-shadow: var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .side-icon {
            width: 48px; height: 48px;
            background: rgba(0, 243, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-dark); font-size: 20px; text-decoration: none;
            transition: all 0.25s ease;
        }
        .side-icon:hover, .side-icon.active {
            background: var(--accent); color: #050811; border-color: var(--accent);
            transform: translateY(-2px); box-shadow: var(--accent-glow);
        }

        /* MAIN CONTENT (OTOMATIS MELEBAR SAAT SIDEBAR HIDE) */
        .main-content {
            flex: 1;
            margin-left: 0;
            display: grid; grid-template-columns: 1fr 400px; gap: 25px; padding: 25px 25px 25px 32px;
            position: relative;
            z-index: 1;
            transition: margin-left 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Geser halus konten jika sidebar sedang terbuka */
        body.sidebar-open .main-content {
            margin-left: 80px;
        }

        .video-section { display: flex; flex-direction: column; gap: 25px; }
        .main-title-top {
            font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); padding: 5px 10px;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }
        .main-title-top span {
            color: var(--accent);
            text-shadow: var(--accent-glow);
        }

        .player-wrapper {
            background: var(--glass-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 32px; padding: 24px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
        }

        .player-box {
            position: relative; width: 100%; aspect-ratio: 16/9; background: #02040a; border-radius: 24px; overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
        }
        .video-frame { width: 100%; height: 100%; border-radius: 24px; }

        .badge {
            position: absolute; top: 20px; left: 20px;
            background: rgba(6, 11, 24, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; padding: 8px 16px; border-radius: 30px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; z-index: 10;
            border: 1px solid rgba(0, 243, 255, 0.35); letter-spacing: 0.8px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .dot {
            width: 8px; height: 8px; background: var(--live-red); border-radius: 50%;
            box-shadow: 0 0 10px var(--live-red);
            animation: pulse 1.5s infinite;
        }

        .modern-view-badge {
            background: rgba(0, 243, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 14px; color: var(--text-dark);
            border: 1px solid var(--glass-border); display: inline-flex; align-items: center; gap: 8px;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.08);
        }
        .live-dot-indicator {
            width: 8px; height: 8px; background: var(--live-red); border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px var(--live-red);
            animation: pulse 1.5s infinite;
        }

        /* CHAT SECTION */
        .chat-card {
            background: var(--glass-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 32px; display: flex; flex-direction: column;
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
            height: calc(100vh - 50px); position: sticky; top: 25px;
        }

        .chat-header {
            padding: 24px; font-weight: 700; font-size: 15px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; color: var(--text-dark);
        }

        .msgs { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { display: flex; gap: 12px; animation: slideIn 0.3s ease-out; align-items: flex-start; }
        .msg img {
            width: 36px; height: 36px; border-radius: 50% !important; object-fit: cover; flex-shrink: 0;
            border: 1px solid var(--accent);
        }

        .bubble {
            background: var(--bubble-bg); backdrop-filter: blur(10px);
            padding: 12px 16px; border-radius: 20px;
            border-top-left-radius: 4px; font-size: 13px; line-height: 1.5;
            flex: 1; color: var(--text-dark); border: 1px solid var(--bubble-border);
        }
        .bubble b { color: var(--accent); font-size: 11px; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-area {
            padding: 20px; background: rgba(0, 243, 255, 0.03);
            border-top: 1px solid var(--glass-border); border-bottom-left-radius: 32px; border-bottom-right-radius: 32px;
        }
        .chat-row { display: flex; gap: 12px; align-items: center; }

        .chat-in {
            flex: 1; background: var(--input-bg); border: 1px solid var(--glass-border);
            padding: 12px 18px; border-radius: 16px; color: var(--text-dark);
            outline: none; font-size: 13px; font-weight: 500;
        }
        .chat-in:focus {
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        .btn-send {
            background: var(--accent); border: none; width: 44px; height: 44px; border-radius: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: #050811; font-size: 16px;
            box-shadow: var(--accent-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-send:hover {
            transform: scale(1.05);
            background: var(--accent-hover);
        }

        .btn-upload {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-dark);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .btn-upload:hover {
            background: var(--accent);
            color: #050811;
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- AREA PEMICU DI TEPI KIRI -->
<div class="sidebar-trigger" id="sidebarTrigger" title="Arahkan mouse ke sini untuk menu"></div>

<!-- SIDEBAR AUTO-HIDE -->
<div class="sidebar" id="sidebar">
    <div class="brand-logo">H</div>
    <a href="https://www.youtube.com/@hafidin3568" target="_blank" class="side-icon" title="YouTube Channel">📺</a>
    <div style="margin-top: auto;" class="side-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Ganti Mode Cyber">☀️</div>
</div>

<div class="main-content">
    <div class="video-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="main-title-top">HafidStream <span>Premium V3</span></div>
        </div>

        <div class="player-wrapper">
            <div class="player-box">
                <div class="badge"><div class="dot"></div> LIVE HAFID HD</div>
                <video id="player" class="video-frame" crossorigin playsinline></video>
            </div>

            <div style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between;">
                <h2 style="margin:0; font-size: 20px; font-weight:700; color:var(--text-dark);">Siaran Langsung</h2>

                <div class="modern-view-badge">
                    <span class="live-dot-indicator"></span>
                    <span id="viewCount">1.451.653</span> Penonton
                </div>
            </div>
        </div>
    </div>

    <div class="chat-card">
        <div class="chat-header">
            <span>Chat Utama</span>
            <span style="font-size:11px; color:var(--live-green); font-weight:700; text-shadow: 0 0 8px var(--live-green);">● Aktif</span>
        </div>

        <div class="msgs" id="msgs"></div>

        <div class="input-area">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                <img id="displayPP" src="https://ui-avatars.com/api/?name=Anonim&background=00f3ff&color=050811" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border: 1px solid var(--accent);">

                <input type="file" id="fileAvatarInput" accept="image/*" style="display:none;" onchange="handleGalleryUpload(event)">
                <button type="button" class="btn-upload" onclick="document.getElementById('fileAvatarInput').click()">📷 Galeri</button>

                <input type="text" id="uName" style="background:transparent; border:none; color:var(--text-dark); font-weight:700; outline:none; font-size:13px; width:100%;" placeholder="Ketik nama..." oninput="updateDefaultAvatar()">
            </div>

            <div class="chat-row">
                <input type="text" id="chatIn" class="chat-in" placeholder="Ketik pesan...">
                <button class="btn-send" onclick="sendMsg()">🚀</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://ggvfeibnwzliyrxufslx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndmZlaWJud3psaXlyeHVmc2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTQ4NjUsImV4cCI6MjEwNDE3MDg2NX0.u_oawCXaHGBbo7ZI3S3bm1c5Qs7OKGS_M6yVh6KYN2M';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    const liveStreamUrl = "http://localhost:8080/hls/Gared.m3u8";
    const video = document.getElementById('player');

    // LOGIKA AUTO-HIDE SIDEBAR KIRI
    const sidebar = document.getElementById('sidebar');
    const sidebarTrigger = document.getElementById('sidebarTrigger');
    let hideTimeout;

    function showSidebar() {
        clearTimeout(hideTimeout);
        sidebar.classList.add('show');
        document.body.classList.add('sidebar-open');
    }

    function hideSidebar() {
        hideTimeout = setTimeout(() => {
            sidebar.classList.remove('show');
            document.body.classList.remove('sidebar-open');
        }, 250);
    }

    sidebarTrigger.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseleave', hideSidebar);
    sidebarTrigger.addEventListener('mouseleave', () => {
        if (!sidebar.matches(':hover')) hideSidebar();
    });

    // PLYR.IO INITIALIZATION
    function initPlyrPlayer() {
        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
            autoplay: true,
            muted: true
        });

        if (Hls.isSupported()) {
            const hls = new Hls({ maxPixelRatio: 1, lowLatencyMode: true });
            hls.loadSource(liveStreamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(() => {});
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = liveStreamUrl;
            video.play().catch(() => {});
        }
    }

    // AVATAR SYSTEM
    const defaultAvatarUrl = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Anonim')}&background=00f3ff&color=050811`;
    let isCustomAvatar = false;
    let currentUserAvatar = defaultAvatarUrl('Anonim');

    function updateDefaultAvatar() {
        if (!isCustomAvatar) {
            const user = document.getElementById('uName').value.trim() || 'Anonim';
            currentUserAvatar = defaultAvatarUrl(user);
            document.getElementById('displayPP').src = currentUserAvatar;
        }
    }

    function handleGalleryUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                isCustomAvatar = true;
                currentUserAvatar = e.target.result;
                document.getElementById('displayPP').src = currentUserAvatar;
            };
            reader.readAsDataURL(file);
        }
    }

    // COUNTER PENONTON
    let currentViewers = 1451653;
    function updateViewerCounter() {
        currentViewers += Math.floor(Math.random() * 31) - 12;
        document.getElementById('viewCount').innerText = currentViewers.toLocaleString('id-ID');
        setTimeout(updateViewerCounter, Math.floor(Math.random() * 1000) + 1500);
    }

    // CHAT SYSTEM
    function renderChat(d) {
        if (!d || !d.content) return;
        const box = document.getElementById('msgs');
        const div = document.createElement('div');
        div.className = 'msg';
        const fallbackAvatar = defaultAvatarUrl(d.username || 'Anonim');

        div.innerHTML = `
            <img src="${d.avatar_url || fallbackAvatar}" onerror="this.src='${fallbackAvatar}'">
            <div class="bubble">
                <b>${d.username || 'Anonim'}</b>
                ${d.content}
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function initLiveChat() {
        const box = document.getElementById('msgs');
        box.innerHTML = '<div style="text-align:center; font-size:12px; opacity:0.6;">Memuat chat...</div>';

        const { data, error } = await sb.from('messages').select('*').order('id', { ascending: false }).limit(30);
        box.innerHTML = '';

        if (!error && data) {
            data.reverse().forEach(renderChat);
        }

        sb.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderChat(payload.new);
            })
            .subscribe();
    }

    async function sendMsg() {
        const inEl = document.getElementById('chatIn');
        const text = inEl.value.trim();
        const user = document.getElementById('uName').value.trim() || 'Anonim';
        if (!text) return;
        inEl.value = '';

        const finalAvatar = isCustomAvatar ? currentUserAvatar : defaultAvatarUrl(user);
        await sb.from('messages').insert([{ username: user, content: text, avatar_url: finalAvatar }]);
    }

    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    }

    document.addEventListener("DOMContentLoaded", () => {
        initPlyrPlayer();
        initLiveChat();
        updateViewerCounter();
    });

    document.getElementById('chatIn').onkeypress = e => { if (e.key === 'Enter') sendMsg(); };
</script>
</body>
</html>
